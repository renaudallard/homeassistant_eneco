name: HACS

on:
  push:
  pull_request:
  # HACS changes its rules independently of this repository.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: Validate the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
