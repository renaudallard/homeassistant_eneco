name: release

on:
  release:
    types: [published]
  # So an existing release can be given its archive after the fact.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to attach the archive to
        required: true

permissions:
  contents: write

jobs:
  archive:
    name: Attach the HACS archive
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Check the manifest matches the tag
        run: |
          version=$(jq -r .version custom_components/eneco_be/manifest.json)
          if [ "v$version" != "$TAG" ]; then
            echo "manifest says $version but the tag is $TAG" >&2
            exit 1
          fi

      - name: Build the archive
        run: |
          # HACS extracts this straight into custom_components/eneco_be, so the
          # integration's files have to sit at the root of the archive.
          cd custom_components/eneco_be
          zip -qr "$GITHUB_WORKSPACE/eneco_be.zip" . \
            -x '*.pyc' '__pycache__/*' '*/__pycache__/*'
          cd "$GITHUB_WORKSPACE"
          unzip -l eneco_be.zip
          unzip -p eneco_be.zip manifest.json > /dev/null

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" eneco_be.zip --clobber
