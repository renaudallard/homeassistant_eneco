name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Format
        run: ruff format --check custom_components tests tools

      - name: Lint
        run: ruff check custom_components tests tools

      - name: Types
        run: mypy custom_components/eneco_be tests tools

      - name: Translations and icons
        run: python tools/check-translations.py

      - name: Tests
        run: pytest tests -q
